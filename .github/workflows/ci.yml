name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.88.0 fmt --all -- --check
      - run: cargo +1.88.0 test --locked --all-targets
      - run: cargo +1.88.0 clippy --locked --all-targets -- -D warnings
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/amd64 --target runtime -t l4-parakeet-rs:ci .
      - run: docker run --rm l4-parakeet-rs:ci --help
      - run: docker build --platform linux/amd64 --target converter -t l4-parakeet-rs:converter .
      - run: docker run --rm l4-parakeet-rs:converter --help
