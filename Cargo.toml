[package]
name = "parakeet-l4"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "NVIDIA L4-specific Parakeet TDT inference engine"
build = "build.rs"

[features]
default = []
cuda = ["dep:cudarc", "cudarc/cufft", "cudarc/f16", "cudarc/f8"]

[dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
float8 = "0.7"
half = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tiny_http = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
cudarc = { version = "0.19.9", optional = true, default-features = false, features = [
  "cuda-13000",
  "driver",
  "fallback-dynamic-loading",
  "nvrtc",
  "std",
] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
